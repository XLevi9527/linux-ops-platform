global:
  smtp_smarthost: 'smtp.163.com:465'
  smtp_from: 'your-address@163.com'
  smtp_auth_username: 'your-address@163.com'
  smtp_auth_password_file: '/run/secrets/163_smtp_password'
  smtp_require_tls: true

route:
  receiver: 'email'
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: 'email'
    email_configs:
      - to: 'your-address@163.com'
        send_resolved: true
